version: 2

updates:
  - allow:
      - dependency-type: direct
    commit-message:
      include: scope
      prefix: chore
    directory: /
    open-pull-requests-limit: 99
    package-ecosystem: docker
    reviewers:
      - 'ridedott/vehicle-integrations'
    schedule:
      interval: daily
    cooldown:
      default-days: 30
  - allow:
      - dependency-type: direct
    commit-message:
      include: scope
      prefix: chore
    directory: /
    open-pull-requests-limit: 99
    package-ecosystem: github-actions
    reviewers:
      - 'ridedott/vehicle-integrations'
    schedule:
      interval: daily
    cooldown:
      default-days: 30
      exclude:
        - 'ridedott/*'
